<!doctype html>
<!--
  Problem pages: Blocks mockups (docs/PROBLEM-PAGES.md). Not app code: a picture of the plan.
  One frame per hash (#page, #working, #checked, #offer, #fix, #next, #done), iPad Air 13" landscape
  (1366 x 1024 pt). Rendered to PNG by docs/problem-pages/render.sh (headless Chrome).
  The page is drawn in page units (1600 x 900) inside an SVG, so its numbers are the doc's numbers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1366">
<title>Problem pages mockups</title>
<style>
  @font-face { font-family: "Bricolage"; src: url("../../ios/Packages/AgathonDesign/Sources/AgathonDesign/Resources/Fonts/BricolageGrotesque-Variable.ttf"); font-weight: 200 800; }
  @font-face { font-family: "Lexend"; src: url("../../ios/Packages/AgathonDesign/Sources/AgathonDesign/Resources/Fonts/Lexend-Variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Kalam"; src: url("../../ios/Packages/AgathonDesign/Sources/AgathonDesign/Resources/Fonts/Kalam-Bold.ttf"); font-weight: 700; }
  :root {
    --ground: #F1F2F6; --paper: #FFFFFF; --sunken: #F1F2F6; --ink: #14151F; --ink2: #5B5E6E; --onInk: #FFFFFF;
    --onInk2: #BDBDC0; --onInkFaint: #3E3F47; --sunny: #FFD12E; --tomato: #FF5A36; --cobalt: #2D5BFF; --cobaltDeep: #2148E3;
    --success: #12A150; --line: #E2E4EB; --guide: #E6E8EE; --faint: #A3A6B4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1366px; height: 1024px; overflow: hidden; background: var(--ground); font-family: "Lexend", system-ui; color: var(--ink); }
  .abs { position: absolute; }
  .round { width: 56px; height: 56px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 22px; font-weight: 600; }
  .title { font-family: "Bricolage"; font-weight: 800; font-size: 24px; letter-spacing: -0.72px; }
  .sub { font-size: 14px; color: var(--ink2); }
  .pill { height: 40px; border-radius: 20px; background: var(--paper); display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; font-size: 15px; }
  .btn { border-radius: 999px; display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 19px; white-space: nowrap; }
  .btn.ink { background: var(--ink); color: var(--onInk); }
  .btn.sunny { background: var(--sunny); color: var(--ink); }
  .btn.paper { background: var(--paper); color: var(--ink); }
  .btn.chalk { background: var(--sunken); color: var(--ink); }
  .btn.large { height: 64px; padding: 0 28px 0 10px; }
  .btn.regular { height: 56px; padding: 0 22px; }
  .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
  .dock { height: 84px; border-radius: 42px; background: var(--ink); display: flex; align-items: center; padding: 0 14px; gap: 6px; }
  .tool { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--onInk); font-size: 22px; }
  .tool.on { background: var(--sunny); color: var(--ink); }
  .sep { width: 2px; height: 34px; background: var(--onInkFaint); margin: 0 6px; }
  .swatch { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; }
  .swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; }
  .helpme { white-space: nowrap; height: 72px; min-width: 210px; border-radius: 36px; background: var(--sunny); display: inline-flex; align-items: center; gap: 10px; padding: 0 32px 0 18px;
            font-family: "Bricolage"; font-weight: 800; font-size: 28px; letter-spacing: -0.84px; }
  .chooser { white-space: nowrap; height: 72px; border-radius: 36px; background: var(--paper); display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; font-weight: 600; font-size: 18px; }
  .check { height: 72px; border-radius: 36px; background: var(--ink); color: var(--onInk); display: inline-flex; align-items: center; gap: 12px; padding: 0 30px 0 12px;
           font-family: "Bricolage"; font-weight: 800; font-size: 28px; letter-spacing: -0.84px; }
  .check .badge { background: var(--onInkFaint); color: var(--onInk); width: 48px; height: 48px; }
  .readback { height: 34px; border-radius: 17px; background: var(--sunken); display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 12px; white-space: nowrap; }
  .readback b { font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: 0.6px; text-transform: uppercase; }
  .readback span { font-size: 16px; color: var(--ink); }
  .readback.unsure { box-shadow: none; background: #FFF4C9; }
  .readback em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .hint { width: 380px; background: var(--cobalt); border-radius: 6px 28px 28px 28px; padding: 20px; color: var(--onInk); }
  .hint .lab { font-size: 14px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
  .hint p { font-size: 19px; line-height: 1.4; margin-top: 10px; }
  .hint .q { font-size: 17px; margin-top: 6px; }
  .hint .row { display: flex; gap: 8px; margin-top: 14px; }
  .cardbtn { height: 56px; border-radius: 28px; padding: 0 22px; display: inline-flex; align-items: center; font-weight: 600; font-size: 18px; }
  .cheer { height: 48px; border-radius: 24px; background: var(--sunny); display: inline-flex; align-items: center; padding: 0 20px; font-weight: 600; font-size: 20px; }
  .note { background: var(--ink); color: var(--onInk); border-radius: 22px; padding: 14px 20px; font-size: 17px; display: inline-flex; gap: 10px; align-items: center; }
  .sheet { background: var(--paper); border-radius: 28px; padding: 28px; }
  .h2 { font-family: "Bricolage"; font-weight: 800; font-size: 24px; letter-spacing: -0.72px; }
  .label { font-size: 14px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink2); }
  .chip { height: 56px; border-radius: 28px; background: var(--sunken); display: inline-flex; align-items: center; padding: 0 22px; font-size: 22px; font-weight: 500; }
  .key { width: 64px; height: 56px; border-radius: 16px; background: var(--sunken); display: grid; place-items: center; font-size: 24px; font-weight: 600; }
  .key.op { background: #E6E8EE; }
  .key.wide { width: 136px; }
  .field { height: 64px; border-radius: 32px; background: var(--sunken); display: flex; align-items: center; padding: 0 24px; font-size: 28px; font-weight: 500; box-shadow: inset 0 0 0 3px var(--cobalt); }
  .caret { display: inline-block; width: 3px; height: 30px; background: var(--cobalt); margin-left: 2px; vertical-align: middle; }
  .scrim { position: absolute; inset: 0; background: rgba(20, 21, 31, 0.28); }
  .tag { height: 30px; border-radius: 15px; background: var(--sunken); padding: 0 12px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink2); }
  .callout { position: absolute; background: var(--tomato); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
  .legend { position: absolute; left: 40px; bottom: 6px; font-size: 12px; color: var(--ink2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = { x: 40, y: 138, k: 1286 / 1600 };           // the fitted page on an iPad Air 13" (landscape)
const vx = (x) => P.x + x * P.k, vy = (y) => P.y + y * P.k;
const KID = "Bradley Hand, Chalkboard SE, cursive";      // stands in for the kid's ink
const L = { problemX: 88, problemBase: 118, workTop: 186, rows: [260, 340, 420, 500, 580, 660], guideRight: 1160,
            answer: { x: 88, y: 744, w: 872, h: 116 }, lane: 1180 };

function el(html, x, y, extra = "") {
  const d = document.createElement("div");
  d.className = "abs"; d.style.left = x + "px"; d.style.top = y + "px"; if (extra) d.style.cssText += extra;
  d.innerHTML = html; document.getElementById("root").appendChild(d); return d;
}

/** The page: paper, then the template, then what is written on it (page units). */
function page(inner, { template = true, problem = "4x - 5 = 7", number = "" } = {}) {
  const t = template ? `
    <text x="${L.problemX}" y="${L.workTop + 30}" font-family="Lexend" font-size="22" fill="var(--faint)">Work it out here</text>
    ${L.rows.map((y) => `<line x1="${L.problemX}" x2="${L.guideRight}" y1="${y}" y2="${y}" stroke="var(--guide)" stroke-width="2.5" stroke-linecap="round"/>`).join("")}
    <rect x="${L.answer.x}" y="${L.answer.y}" width="${L.answer.w}" height="${L.answer.h}" rx="28" fill="var(--sunken)"/>
    <text x="${L.answer.x + 32}" y="${L.answer.y + 68}" font-family="Lexend" font-weight="600" font-size="30" fill="var(--ink2)">Answer:</text>` : "";
  const prob = problem ? `<text x="${L.problemX}" y="${L.problemBase}" font-family="Kalam" font-weight="700" font-size="60" fill="var(--cobalt)">${number}${problem}</text>` : "";
  el(`<svg width="1286" height="723" viewBox="0 0 1600 900"><rect width="1600" height="900" rx="22" fill="var(--paper)"/>${t}${prob}${inner}</svg>`, P.x, P.y);
}

/** A line of the kid's ink on a guide row (page units); returns its box. */
function kid(text, row, x = 104, size = 62) {
  return `<text x="${x}" y="${row - 10}" font-family="${KID}" font-weight="700" font-size="${size}" fill="var(--ink)">${text}</text>`;
}
const tick = (x, y) => `<path d="M ${x} ${y} l 14 16 l 30 -40" fill="none" stroke="var(--cobalt)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
const ring = (cx, cy, rx, ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="var(--cobalt)" stroke-width="5" transform="rotate(-2 ${cx} ${cy})"/>
  <path d="M ${cx - rx + 10} ${cy - ry + 18} q 14 -12 34 -16" fill="none" stroke="var(--cobalt)" stroke-width="5" stroke-linecap="round"/>`;

function topBar(sub, { daily = "1 of 5", status = "" } = {}) {
  el(`<div class="round">&#x2039;</div>`, 40, 40);
  el(`<div class="title">Today's practice</div><div class="sub">${sub}</div>`, 112, 44);
  el(`<div style="display:flex;gap:8px;align-items:center">
        <div class="pill"><span style="color:var(--sunny);font-size:18px">&#9733;</span>${daily}</div>
        <div class="pill"><span style="color:var(--success)">&#10003;</span>Saved</div>
        ${status}
        <div class="round" style="font-size:18px">&#128274;</div>
        <div class="btn ink regular" style="height:56px">Ask</div>
        <div class="round">&#8943;</div></div>`, 1366 - 40 - 560, 40, "width:560px;display:flex;justify-content:flex-end");
}

function dock(page = "2/6", { check = false } = {}) {
  const swatches = ["#14151F", "#E5302A", "#F58700", "#12A150", "#E9449A"].map((c, i) =>
    `<div class="swatch" style="${i === 0 ? "box-shadow:inset 0 0 0 3px #fff" : ""}"><i style="background:${c}"></i></div>`).join("");
  el(`<div class="dock"><div class="tool">&#x2B1A;</div><div class="tool on">&#9998;</div><div class="tool">&#9003;</div><div class="tool">&#9711;</div>
       <div class="sep"></div><div class="tool">&#8630;</div><div class="tool">&#8631;</div><div class="sep"></div>${swatches}
       <div class="sep"></div><div class="tool" style="width:40px">&#x2039;</div><div style="color:#fff;font-weight:600;font-size:16px">${page}</div><div class="tool" style="width:40px">&#x203A;</div></div>`, 40, 904);
  el(`<div style="display:flex;gap:8px;align-items:center">
       ${check ? `<div class="check"><span class="badge">&#10003;</span>Check</div>` : ""}
       <div class="helpme"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="17" cy="17" r="11" fill="none" stroke="#14151F" stroke-width="6"/><circle cx="35" cy="12" r="5" fill="#14151F"/><rect x="6" y="34" width="34" height="7" rx="3.5" fill="#14151F"/></svg>Help me</div>
       <div class="chooser">&#128065; Hint &#9662;</div></div>`, 1366 - 40, 910, "transform:translateX(-100%)");
}

function readback(latex, x, y, { unsure = false } = {}) {
  return el(`<div class="readback ${unsure ? "unsure" : ""}"><b>I read</b><span>${latex}</span>${unsure ? "<em>Is this right?</em>" : ""}</div>`, vx(x), vy(y) - 17);
}

function callout(text, x, y) { const c = el(text, x, y); c.className = "callout"; return c; }

const frames = {
  // 1. A practice problem's page, fresh
  page() {
    topBar("Problem 2 of 5");
    page("");
    dock("2/6");
    callout("Problem 2 of 5 (the set)", 112, 92);
    callout("the problem, in the tutor's hand", vx(760), vy(60));
    callout("Work it out here: faint guide lines", vx(760), vy(300));
    callout("the answer spot", vx(990), vy(790));
  },
  // 2. Mid-work: steps written, the tutor quiet (only "I read")
  working() {
    topBar("Problem 2 of 5");
    page(kid("4x = 7 + 5", 340) + kid("4x = 13", 420) + kid("x =", 500));
    readback("4x = 7 + 5", L.lane, 312);
    readback("4x = 13", L.lane, 392);
    el(`<div class="check"><span class="badge">&#10003;</span>Check</div>`, vx(1060), vy(758));
    dock("2/6");
    callout("no ticks, no rings while they work", vx(560), vy(240));
    callout("Check: the kid says done (the page's action corner)", vx(1000), vy(720));
    callout("x = … is unfinished: not read back, never judged", vx(330), vy(470));
  },
  // 3. After Check: ticks on right steps, one gentle ring and a hint
  checked() {
    topBar("Problem 2 of 5");
    page(kid("4x = 7 + 5", 340) + tick(470, 318) + kid("4x = 13", 420) + ring(222, 392, 150, 46) + kid("x = 13 &divide; 4", 818, 300, 60));
    readback("4x = 7 + 5", L.lane, 312);
    readback("4x = 13", L.lane, 392);
    readback("x = 13 &divide; 4", L.lane, 790);
    el(`<div class="hint"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">Hint</span>
        <span class="badge" style="background:var(--cobaltDeep);color:#fff;font-size:18px">&#128264;</span></div>
        <p>Look again at the right side of this line. What is 7 + 5?</p>
        <div class="row"><span class="cardbtn" style="background:#fff;color:var(--ink)">Got it</span><span class="cardbtn" style="background:var(--cobaltDeep);color:#fff">More help</span></div></div>`, vx(90), vy(452));
    dock("2/6", { check: false });
    callout("the answer, written in the answer spot, starts the check", vx(990), vy(770));
  },
  // 4. A second problem on the page: offer a new page for it
  offer() {
    topBar("Problem 2 of 5", { daily: "2 of 5" });
    page(kid("4x = 12", 340) + tick(330, 318) + kid("x = 3", 420) + tick(270, 398) + kid("5y + 2 = 17", 580) + kid("x = 3", 818, 300, 60) + tick(480, 796));
    readback("4x = 12", L.lane, 312);
    readback("x = 3", L.lane, 392);
    readback("5y + 2 = 17", L.lane, 552);
    el(`<div style="display:flex;gap:10px;align-items:center">
          <div class="btn ink large"><span class="badge" style="background:var(--onInkFaint);color:#fff">+</span>New page for this one</div>
          <div class="btn chalk regular" style="color:var(--ink2)">Keep it here</div></div>`, vx(104), vy(604));
    dock("2/6");
    callout("a new problem after the solved one: no ring; offered its own page", vx(560), vy(510));
  },
  // 5. The readback chip, and tap to fix (a misread x)
  fix() {
    topBar("Problem 2 of 5");
    page(kid("4x = 12", 340));
    readback("4 &times; = 12", L.lane, 312, { unsure: true });
    el("", 0, 0, "inset:0;width:1366px;height:1024px;background:rgba(20,21,31,0.28)");
    const keys = [["7","8","9","&divide;","&#9003;"],["4","5","6","&times;","("],["1","2","3","&minus;",")"],["0",".","=","+","x"],["y","a/b","x&#178;","&radic;","n"]];
    el(`<div class="sheet" style="width:560px">
          <div style="display:flex;justify-content:space-between;align-items:center"><div class="h2">Fix what I read</div><div class="round" style="background:var(--sunken);width:52px;height:52px">&times;</div></div>
          <div class="label" style="margin-top:18px">I read</div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
            <div style="font-size:34px;font-weight:500">4 &times; = 12</div>
            <div class="btn chalk regular" style="padding:0 20px 0 8px"><span class="badge" style="background:#fff;width:40px;height:40px;font-size:18px">&#10003;</span>Yes, that's right</div></div>
          <div class="label" style="margin-top:22px">Did you mean</div>
          <div style="display:flex;gap:10px;margin-top:10px"><div class="chip" style="background:var(--ink);color:#fff">4x = 12</div><div class="chip">4 + = 12</div></div>
          <div class="label" style="margin-top:22px">Or type it</div>
          <div class="field" style="margin-top:10px">4x = 12<span class="caret"></span></div>
          <div style="display:grid;grid-template-columns:repeat(5,64px);gap:8px;margin-top:14px;justify-content:center">
            ${keys.flat().map((k, i) => `<div class="key ${i % 5 >= 3 ? "op" : ""}">${k}</div>`).join("")}</div>
          <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><div class="btn chalk regular">Cancel</div><div class="btn ink regular">Use this</div></div>
        </div>`, 1366 - 40 - 560, 112);
    callout("asked, never swapped: a &times; where no product can be, on an x page", vx(330), vy(250));
  },
  // 6. Solved: the cheer and a big Next
  next() {
    topBar("Problem 2 of 5", { daily: "2 of 5" });
    page(kid("4x = 12", 340) + tick(330, 318) + kid("x = 12 &divide; 4", 420) + tick(480, 398) + kid("x = 3", 818, 300, 60) + tick(480, 796));
    readback("4x = 12", L.lane, 312);
    readback("x = 12 &divide; 4", L.lane, 392);
    readback("x = 3", L.lane, 790);
    el(`<div class="cheer">You solved it.</div>`, vx(560), vy(778));
    el(`<div class="btn ink large" style="height:72px;padding:0 30px 0 12px;font-family:Bricolage;font-weight:800;font-size:28px;letter-spacing:-0.84px">
          <span class="badge" style="background:var(--sunny);color:var(--ink);width:48px;height:48px">&#x203A;</span>Next problem</div>`, vx(1060), vy(758));
    dock("2/6");
    // the burst
    const bits = [[600,300,"var(--sunny)"],[640,250,"var(--tomato)"],[700,330,"var(--cobalt)"],[560,260,"var(--tomato)"],[760,280,"var(--sunny)"],[520,330,"var(--cobalt)"]];
    bits.forEach(([x, y, c], i) => el(`<div style="width:${i % 2 ? 18 : 12}px;height:${i % 2 ? 6 : 12}px;border-radius:6px;background:${c};transform:rotate(${i * 37}deg)"></div>`, x, y));
  },
  // 7. All done: the set's stickers
  done() {
    topBar("All done", { daily: "5 of 5" });
    page(`<g transform="translate(690 120) scale(1.1)">
            <circle cx="60" cy="60" r="44" fill="none" stroke="var(--cobalt)" stroke-width="26"/>
            <circle cx="160" cy="44" r="22" fill="var(--sunny)"/>
            <rect x="12" y="132" width="196" height="36" rx="18" fill="var(--tomato)"/>
            <circle cx="48" cy="56" r="7" fill="var(--ink)"/><circle cx="74" cy="56" r="7" fill="var(--ink)"/>
            <path d="M 46 76 q 15 14 30 0" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linecap="round"/></g>
          <text x="800" y="420" text-anchor="middle" font-family="Bricolage" font-weight="800" font-size="88" letter-spacing="-4" fill="var(--ink)">All done.</text>
          <text x="800" y="478" text-anchor="middle" font-family="Lexend" font-size="30" fill="var(--ink2)">5 problems. 4 on your own.</text>`, { template: false, problem: "" });
    const sticker = (kind, n) => {
      const body = kind === "star"
        ? `<svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 4 l8 18 20 2 -15 13 5 20 -18 -10 -18 10 5 -20 -15 -13 20 -2z" fill="var(--sunny)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>`
        : `<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="20"/><circle cx="32" cy="32" r="22" fill="none" stroke="var(--cobalt)" stroke-width="12"/></svg>`;
      return `<div style="display:grid;justify-items:center;gap:6px">${body}<div style="color:var(--onInk2);font-size:14px;font-weight:600">${n}</div></div>`;
    };
    el(`<div style="background:var(--ink);border-radius:32px;padding:20px 34px;display:flex;gap:34px">${["star","star","ring","star","star"].map((k, i) => sticker(k, i + 1)).join("")}</div>`, vx(800), vy(540), "transform:translateX(-50%)");
    el(`<div style="display:flex;gap:12px"><div class="btn chalk regular">Back to my boards</div><div class="btn ink regular">More like these</div></div>`, vx(800), vy(740), "transform:translateX(-50%)");
    dock("6/6");
    callout("a star: done on your own; a ring: done with a hint", vx(1130), vy(560));
  },
};
(frames[location.hash.slice(1)] || frames.page)();
</script>
</body>
</html>
