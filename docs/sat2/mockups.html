<!doctype html>
<!--
  SAT mode v2 mockups (docs/SAT-V2.md, docs/sat2/DESIGN-NOTES.md). Not app code: a picture of the plan.
  One frame per hash (#f01 … #f13); with no hash, every frame on one sheet with its caption.
  iPad Air 13": landscape 1366 x 1024 pt, portrait 1024 x 1366 pt. render.sh renders each at 2x.
  The board's page is drawn in PAGE UNITS (1600 wide) inside a scaled box, so every number in the
  page code is a number from DESIGN-NOTES.md. Chrome (top bar, dock, Help me, sheets) is view space, pt.
  Handwriting is the real hand engine's strokes (ink.js, from ink-gen.ts), never a typeface.
  Questions are real bank items (data/sat/bank.json); nudge / why / desmos_steps are mock copy
  (the bank lane writes the real ones).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT v2 mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Lexend:wght@300..700&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="ink.js"></script>
<script src="icons.js"></script>
<style>
  :root {
    --ground: #F1F2F6; --paper: #FFFFFF; --sunken: #F1F2F6; --ink: #14151F; --ink2: #5B5E6E; --onInk: #FFFFFF;
    --onInk2: #BDBDC0; --onInkFaint: #3E3F47; --sunny: #FFD12E; --tomato: #FF5A36; --cobalt: #2D5BFF; --cobaltDeep: #2148E3;
    --cobaltEmpty: #D9E1FF; --success: #12A150; --line: #E2E4EB; --guide: #E6E8EE; --faint: #A3A6B4; --dot: #D3D6DF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ground); font-family: "Lexend", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.single { overflow: hidden; }
  .screen { position: relative; overflow: hidden; background: var(--paper); }
  .abs { position: absolute; }
  .page { position: absolute; left: 0; top: 0; width: 1600px; transform-origin: 0 0; background: var(--paper); }
  .katex { font-size: 1.06em; }
  .ic { display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- printed question (page units) ---- */
  .qnum { position: absolute; width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: #fff;
          display: grid; place-items: center; font-weight: 600; font-size: 22px; }
  .stem { position: absolute; font-size: 25px; line-height: 40px; font-weight: 400; color: var(--ink); letter-spacing: -0.1px; }
  .stem p + p { margin-top: 14px; }
  .flabel { position: absolute; font-size: 18px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .tick { position: absolute; font-size: 16px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .axl { position: absolute; font-size: 16px; color: var(--ink2); font-weight: 500; white-space: nowrap; }
  .ptable { position: absolute; border-collapse: collapse; font-size: 21px; }
  .ptable th { background: var(--sunken); font-weight: 600; font-size: 19px; padding: 0 22px; height: 56px; text-align: center; }
  .ptable td { padding: 0 22px; height: 54px; text-align: center; font-variant-numeric: tabular-nums; border-top: 1.5px solid var(--line); }
  .ptable th:first-child, .ptable td:first-child { text-align: left; }
  .ptable tr.total td { font-weight: 600; }
  .ptable th:first-child { border-top-left-radius: 14px; border-bottom-left-radius: 14px; }
  .ptable th:last-child { border-top-right-radius: 14px; border-bottom-right-radius: 14px; }

  /* ---- answer cards (page units) ---- */
  .card { position: absolute; border-radius: 26px; background: var(--sunken); display: flex; align-items: center; padding: 0 20px 0 22px; gap: 18px; }
  .card .let { width: 52px; height: 52px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-weight: 600; font-size: 23px; flex: none; }
  .card .txt { font-size: 28px; flex: 0 1 auto; margin-right: auto; white-space: nowrap; }
  .card .el { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--faint); flex: none; }
  .card.sel { background: var(--ink); color: #fff; }
  .card.sel .let { background: #fff; color: var(--ink); }
  .card.sel .el { color: var(--onInk2); }
  .card.out .txt, .card.out .let { color: var(--faint); }
  .card.out .txt { position: relative; }
  .card.out .txt::after { content: ""; position: absolute; left: -8px; width: calc(100% + 16px); top: 50%; height: 3px; margin-top: -1.5px; background: var(--ink2); border-radius: 2px; transform: rotate(-18deg); }
  .card.out .txt .katex { color: var(--faint); }
  .card.out .el { color: var(--ink); background: var(--paper); }
  .card.look { background: var(--sunny); }
  .card.right { background: var(--success); color: #fff; }
  .card.right .let { color: var(--success); }
  .card .tag2 { font-size: 15px; font-weight: 600; letter-spacing: 0.4px; white-space: nowrap; }

  /* ---- tutor (page units) ---- */
  .note { position: absolute; background: var(--cobalt); color: #fff; border-radius: 6px 24px 24px 24px; padding: 16px 22px 18px; }
  .note.up { border-radius: 26px 26px 26px 6px; }
  .note .lab { font-size: 14px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
  .note p { font-size: 21px; line-height: 1.4; margin-top: 6px; }
  .note .foot { font-size: 15px; margin-top: 10px; color: #fff; }
  .note .row { display: flex; gap: 10px; margin-top: 18px; }
  .note .nb { height: 56px; border-radius: 28px; padding: 0 24px; display: inline-flex; align-items: center; font-weight: 600; font-size: 20px; white-space: nowrap; }
  .note .nb.w { background: #fff; color: var(--ink); }
  .note .nb.d { background: var(--cobaltDeep); color: #fff; }
  .tcap { position: absolute; color: var(--cobalt); font-size: 19px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .tcap b { width: 30px; height: 30px; border-radius: 50%; background: var(--cobalt); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 600; }
  .tcap.wait { color: var(--faint); }
  .tcap.wait b { background: var(--cobaltEmpty); color: var(--cobalt); }
  .turn { position: absolute; color: var(--cobalt); font-size: 20px; font-weight: 600; white-space: nowrap; }

  /* ---- chrome (pt) ---- */
  .round { width: 48px; height: 48px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; color: var(--ink); }
  .pill { height: 48px; border-radius: 24px; background: var(--sunken); display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; font-weight: 600; font-size: 16px; white-space: nowrap; color: var(--ink); }
  .tb-title { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 21px; letter-spacing: -0.5px; white-space: nowrap; font-variation-settings: "opsz" 21; }
  .tb-sub { font-size: 16px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
  .dock { height: 72px; border-radius: 36px; background: var(--ink); display: flex; align-items: center; padding: 0 10px; gap: 4px; }
  .tool { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--onInk); }
  .tool.on { background: var(--sunny); color: var(--ink); }
  .sep { width: 2px; height: 30px; background: var(--onInkFaint); margin: 0 6px; }
  .sw { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .sw i { width: 26px; height: 26px; border-radius: 50%; display: block; }
  .sw.on { box-shadow: inset 0 0 0 3px #fff; }
  .helpme { height: 72px; border-radius: 36px; background: var(--sunny); display: inline-flex; align-items: center; gap: 12px; padding: 0 22px 0 16px; white-space: nowrap; }
  .helpme .t { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 26px; letter-spacing: -0.7px; font-variation-settings: "opsz" 26; }
  .pips { display: flex; gap: 5px; margin: -2px 0 -6px 1px; }
  .pips i { width: 22px; height: 5px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--ink); display: block; }
  .pips i.on { background: var(--ink); }
  .check { height: 64px; border-radius: 32px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; gap: 10px; padding: 0 26px 0 12px; white-space: nowrap;
           font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 24px; letter-spacing: -0.6px; }
  .check .bd { width: 42px; height: 42px; border-radius: 50%; background: var(--onInkFaint); display: grid; place-items: center; }
  .check.off { background: var(--guide); color: var(--faint); }
  .check.off .bd { background: var(--line); color: var(--faint); }
  .walk { height: 64px; border-radius: 32px; background: var(--cobalt); color: #fff; display: inline-flex; align-items: center; gap: 14px; padding: 0 24px 0 20px; white-space: nowrap; font-weight: 600; font-size: 19px; }
  .walk .pp { display: flex; gap: 6px; } .walk .pp i { width: 22px; height: 6px; border-radius: 3px; background: var(--cobaltDeep); display: block; } .walk .pp i.on { background: #fff; }
  .quiet { height: 40px; border-radius: 20px; background: var(--sunken); display: inline-flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .quiet .d { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--ink2); }

  /* ---- sheets & app screens (pt) ---- */
  .h-display { font-family: "Bricolage Grotesque"; font-weight: 800; letter-spacing: -0.045em; font-variation-settings: "opsz" 64; }
  .h-title { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 32px; letter-spacing: -0.035em; font-variation-settings: "opsz" 32; }
  .h-head { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 24px; letter-spacing: -0.03em; font-variation-settings: "opsz" 24; }
  .lbl { font-size: 13px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--ink2); }
  .body { font-size: 17px; line-height: 1.45; }
  .cap { font-size: 14px; color: var(--ink2); }
  .btn { height: 56px; border-radius: 28px; display: inline-flex; align-items: center; gap: 10px; padding: 0 24px; font-weight: 600; font-size: 18px; white-space: nowrap; }
  .btn.lg { height: 64px; border-radius: 32px; padding: 0 28px 0 12px; font-size: 19px; }
  .btn.sunny { background: var(--sunny); color: var(--ink); }
  .btn.ink { background: var(--ink); color: #fff; }
  .btn.chalk { background: var(--sunken); color: var(--ink); }
  .btn.paper { background: var(--paper); color: var(--ink); }
  .btn .bd { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .sheetcard { background: var(--paper); border-radius: 28px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; }
  .step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; font-weight: 600; font-size: 15px; }
  .step .s { font-size: 17px; line-height: 1.45; }
  .step .m { font-size: 21px; margin-top: 6px; }
  .expr { display: grid; grid-template-columns: 40px 1fr; align-items: center; height: 48px; background: var(--sunken); border-radius: 14px; margin-top: 10px; overflow: hidden; }
  .expr .g { height: 100%; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--ink2); background: var(--guide); }
  .expr .e { padding: 0 16px; font-size: 20px; }
  .bar { height: 8px; border-radius: 4px; background: var(--guide); position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ink); display: block; }

  /* ---- the contact sheet ---- */
  .sheet-all { padding: 48px 40px 80px; display: flex; flex-direction: column; gap: 56px; align-items: flex-start; }
  .sheet-all h1 { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 40px; letter-spacing: -1.4px; }
  .sheet-all .intro { font-size: 17px; color: var(--ink2); max-width: 880px; line-height: 1.5; margin-top: 8px; }
  .fr h2 { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .fr p { font-size: 15px; color: var(--ink2); max-width: 1000px; line-height: 1.5; margin: 6px 0 14px; }
  .fr .box { border-radius: 18px; overflow: hidden; background: #fff; }
  .fr iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================== data (real bank items)
const Q_PLOT = {"id":"algebra-linear-two-var-0102","skill":"linear equations in two variables","format":"mcq",
  "stem":"A print shop charges a flat setup fee plus a fixed price per poster. The graph shows the total charge $y$, in dollars, for printing $x$ posters. Which equation represents this relationship?",
  "figure":{"kind":"plot","x":{"min":0,"max":10,"step":1,"label":"Posters"},"y":{"min":0,"max":100,"step":10,"label":"Total charge (dollars)"},"grid":true,
    "items":[{"type":"function","expr":"19+6*x"},{"type":"point","at":[0,19],"label":"(0, 19)"},{"type":"point","at":[2,31],"label":"(2, 31)"}]},
  "choices":[{"key":"A","text":"$y=6x+19$"},{"key":"B","text":"$y=12x+19$"},{"key":"C","text":"$y=19x+6$"},{"key":"D","text":"$y=6x+31$"}],
  "answer":{"key":"A"},
  "solution":{"steps":[{"text":"The y-intercept is the setup fee, 19.","math":"b=19"},{"text":"The slope is the rise over the run between the labeled points.","math":"\\frac{31-19}{2-0}=6"},{"text":"So the equation is the following.","math":"y=6x+19"}],"desmos_tip":null},
  // v2 mock copy (the bank lane writes the real fields)
  "nudge":"What's the charge for 0 posters? And how much more does each extra poster add?",
  "why":{"B":"use the rise, 31 − 19 = 12, as the slope and don't divide it by the run, 2 − 0.","C":"swap the slope and the starting fee.","D":"read the second point's 31 as the starting fee."},
  "desmos_steps":[{"text":"Type the two labeled points into a table.","math":null,"table":[["x_1","y_1"],["0","19"],["2","31"]]},{"text":"Fit a line through them.","math":"y_1 \\sim mx_1+b"},{"text":"Desmos shows m = 6 and b = 19.","math":"y=6x+19"}]};

const Q_SHAPE = {"id":"geometry_trig-lines-angles-triangles-0001","skill":"lines, angles, triangles","format":"spr",
  "stem":"In the figure, side $AB$ of triangle $ABC$ is extended past $B$. The angle at $A$ measures $52^\\circ$, the angle at $C$ measures $71^\\circ$, and the exterior angle at $B$ measures $x^\\circ$. What is the value of $x$?",
  "figure":{"kind":"shape","items":[{"type":"polygon","points":[[0,0],[8,0],[4.37,5.59]]},{"type":"segment","from":[8,0],"to":[10.5,0]},{"type":"label","at":[-0.5,-0.4],"text":"A"},{"type":"label","at":[8,-0.6],"text":"B"},{"type":"label","at":[4.37,6.1],"text":"C"},{"type":"arc_angle","at":[0,0],"from":0,"to":52,"label":"$52^\\circ$"},{"type":"arc_angle","at":[4.37,5.59],"from":232,"to":303,"label":"$71^\\circ$"},{"type":"arc_angle","at":[8,0],"from":0,"to":123,"label":"$x^\\circ$"}]},
  "answer":{"accepted":["123"]}};

const Q_TABLE = {"id":"psda-probability-0107","skill":"probability","format":"mcq",
  "stem":"A music streaming app surveyed users about their preferred listening device and whether they have a premium plan. The results are shown in the table. If a user who does not have a premium plan is selected at random, what is the probability that the user prefers a phone?",
  "figure":{"kind":"table","headers":["Device","Premium","Free","Total"],"rows":[["Phone","55","66","121"],["Laptop","12","22","34"],["Speaker","13","32","45"],["Total","80","120","200"]]},
  "choices":[{"key":"A","text":"$\\frac{66}{200}$"},{"key":"B","text":"$\\frac{66}{121}$"},{"key":"C","text":"$\\frac{11}{20}$"},{"key":"D","text":"$\\frac{121}{200}$"}],
  "answer":{"key":"C"}};

// ============================================================== helpers
const K = (t, display = false) => katex.renderToString(t, { throwOnError: false, displayMode: display });
const md = (s) => s.replace(/\$([^$]+)\$/g, (_, t) => K(t));
const cap1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const icon = (name, size = 24, sw = 2.2) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="${sw}">${ICONS[name] || ""}</svg>`;
function rng(seed) { let a = seed >>> 0; return () => { a += 0x6d2b79f5; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function smooth(pts) {
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

// ---- ink (page units). Student pencil: dark ink, 2.9 wide (0.65 x the app's 4.5). Tutor: cobalt, 3.6.
const STU = { c: "#14151F", w: 2.9 }, TUT = { c: "#2D5BFF", w: 3.6 };
let INKS = [];
function ink(key, x, y, pen) { const p = INK[key]; if (!p) throw new Error("no ink " + key);
  INKS.push(`<g transform="translate(${x} ${y})" stroke="${pen.c}" stroke-width="${pen.w}">${p.d.map((d) => `<path d="${d}"/>`).join("")}</g>`);
  return { x, y, w: p.w, top: y + p.top, bottom: y + p.bottom, right: x + p.w }; }
const stu = (k, x, y) => ink(k, x, y, STU), tut = (k, x, y) => ink(k, x, y, TUT);
function path(d, pen, extra = "") { INKS.push(`<path d="${d}" stroke="${pen.c}" stroke-width="${pen.w}" ${extra}/>`); }
/** A hand-drawn loop around (cx, cy): a bit more than one turn, wobbly, not closed neatly. */
function loop(cx, cy, rx, ry, seed, pen = STU) {
  const r = rng(seed), pts = [], n = 30, a0 = -2.2 + r() * 0.4, turn = 2 * Math.PI * 1.07;
  for (let i = 0; i <= n; i++) { const t = i / n, a = a0 + t * turn, k = 1 + (r() - 0.5) * 0.05 + t * 0.07;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k * 0.97]); }
  path(smooth(pts), pen);
}
/** A sketched straight line: slight bow and tremor, ends overshoot a touch. */
function sketch(x1, y1, x2, y2, seed, pen = STU) {
  const r = rng(seed), n = 9, pts = [], len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / len, ny = (x2 - x1) / len, bow = (r() - 0.5) * len * 0.03;
  for (let i = 0; i <= n; i++) { const t = -0.03 + i / n * 1.06, b = Math.sin(t * Math.PI) * bow + (r() - 0.5) * 0.9;
    pts.push([x1 + (x2 - x1) * t + nx * b, y1 + (y2 - y1) * t + ny * b]); }
  path(smooth(pts), pen);
}
/** The tutor's tick: a short down-stroke, then a long sweep up. */
function tickMark(x, y, s = 1) { path(`M${x} ${y - 14 * s} q ${6 * s} ${8 * s} ${11 * s} ${18 * s} q ${9 * s} ${-24 * s} ${30 * s} ${-42 * s}`, { c: TUT.c, w: 4.4 }); }
/** The tutor's ring round a line. */
function ring(cx, cy, rx, ry, seed) { loop(cx, cy, rx, ry, seed, { c: TUT.c, w: 3.6 }); }

// ============================================================== the page
const PAGE_W = 1600, M = 72, QTOP = 104;
const STEM_X = 140, STEM_W_BESIDE = 680, FIG_X = 880, FIG_W = 648;
const CARD_H = 112, CARD_H_TALL = 132, GAP = 24, DOCK_LANE_PT = 110, WORK_MIN = 360, BAND_MIN = 200;

let PG, L, SCR;   // the page element, its layout, the screen
function screen(orient = "land", bg = "var(--paper)") {
  const w = orient === "port" ? 1024 : 1366, h = orient === "port" ? 1366 : 1024;
  document.getElementById("root").innerHTML = "";
  SCR = document.createElement("div"); SCR.className = "screen"; SCR.style.cssText = `width:${w}px;height:${h}px;background:${bg}`;
  document.getElementById("root").appendChild(SCR);
  return { w, h };
}
function put(html, x, y, css = "", parent) { const d = document.createElement("div"); d.className = "abs"; d.style.left = x + "px"; d.style.top = y + "px";
  if (css) d.style.cssText += css; d.innerHTML = html; (parent || SCR).appendChild(d); return d; }
const putP = (html, x, y, css = "") => put(html, x, y, css, PG);

/**
 * Lays a question out on its page (the rules in DESIGN-NOTES.md):
 * the question block at the top (stem, figure beside when it fits, else below), the answer row at
 * the bottom of the page, and the work area as everything between, at least WORK_MIN tall.
 */
function questionPage(q, { orient = "land", num = 4, cards = {}, answerBox = null } = {}) {
  const { w, h } = screen(orient);
  const k = w / PAGE_W;
  const offY = Math.max(0, 84 - QTOP * k);           // the question never sits under the top bar
  const viewH = (h - offY) / k;
  PG = document.createElement("div"); PG.className = "page"; SCR.appendChild(PG); PG.style.transform = `translateY(${offY}px) scale(${k})`;
  INKS = [];
  // the question number, hanging in the margin like a printed test
  putP(`${num}`, M, QTOP + 2, "").className = "qnum";
  // figure placement: beside when the stem fits a 680 column and the figure fits 648 wide
  const fig = q.figure, beside = !!fig;
  const stemW = beside ? STEM_W_BESIDE : 1388;
  const stem = putP(`<p>${md(q.stem)}</p>`, STEM_X, QTOP, `width:${stemW}px`); stem.className = "stem";
  const stemH = stem.offsetHeight;
  let figBox = null;
  if (fig) figBox = drawFigure(fig, FIG_X, QTOP + 4);
  const qBottom = Math.max(QTOP + stemH, figBox ? figBox.y + figBox.h : 0);
  // answer row at the page bottom, above the dock lane; the page grows when the work area would be < WORK_MIN
  const tall = q.choices && q.choices.some((c) => c.text.includes("frac"));
  const rowH = answerBox ? 132 : (tall ? CARD_H_TALL : CARD_H);
  const dockLane = DOCK_LANE_PT / k;
  let pageH = Math.max(viewH, QTOP + stemH + 48 + WORK_MIN + 32 + rowH + dockLane, qBottom + 32 + BAND_MIN + 32 + rowH + dockLane);
  const rowTop = pageH - dockLane - rowH;
  PG.style.height = pageH + "px";
  L = { k, offY, w, h, stemH, stemBottom: QTOP + stemH, fig: figBox, qBottom, rowTop, rowH, pageH,
        workTop: QTOP + stemH + 48, workBottom: rowTop - 32 };
  dots(L, stem);
  if (q.choices) drawCards(q.choices, rowTop, rowH, cards);
  if (answerBox) drawAnswerBox(rowTop, answerBox);
  return L;
}

/** The dot grid: the work area is dotted paper, the printed question is clean paper. */
function dots(L) {
  const P = 36, out = [];
  const keep = [];
  keep.push({ x0: STEM_X - 80, y0: QTOP - 20, x1: STEM_X + STEM_W_BESIDE + 24, y1: L.stemBottom + 24 });
  if (L.fig) keep.push({ x0: L.fig.x - 28, y0: L.fig.y - 24, x1: PAGE_W, y1: L.fig.y + L.fig.h + 24 });
  for (let y = QTOP + 18; y <= L.workBottom; y += P) for (let x = M + 14; x <= PAGE_W - M; x += P) {
    if (keep.some((b) => x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1)) continue;
    out.push(`<circle cx="${x}" cy="${y}" r="1.8"/>`);
  }
  const s = putP(`<svg width="1600" height="${L.pageH}" fill="var(--dot)">${out.join("")}</svg>`, 0, 0, "z-index:0");
  PG.prepend(s);
}

function drawCards(choices, top, h, state) {
  const n = choices.length, cw = (PAGE_W - 2 * M - (n - 1) * GAP) / n;
  choices.forEach((c, i) => {
    const s = state[c.key] || "";
    const tail = s === "right" ? `<span class="el" style="color:#fff">${icon("check", 26, 3)}</span>` : "";
    const el = s === "right" || s === "look" ? "" : `<span class="el">${icon(s === "out" ? "rotate-ccw" : "x", 22, 2.4)}</span>`;
    putP(`<span class="let">${c.key}</span><span class="txt">${c.text.replace(/\$([^$]+)\$/g, (_, t) => K(t.includes("frac") ? "\\displaystyle " + t : t))}</span>${tail}${el}`, M + i * (cw + GAP), top, `width:${cw}px;height:${h}px`).className = "card " + s;
  });
}

// ---- figures (printed: ink lines, Lexend labels, KaTeX math), drawn natively in the app
function drawFigure(fig, x, y) {
  if (fig.kind === "plot") return drawPlot(fig, x, y);
  if (fig.kind === "shape") return drawShape(fig, x, y);
  if (fig.kind === "table") return drawTable(fig, x, y);
}
let PLOT;   // graph coords -> page units, for ink on the figure
function drawPlot(f, x, y) {
  const padL = 92, padB = 70, W = 640, H = 470, ix = x + padL, iy = y + 8, iw = W - padL - 12, ih = H - padB - 8;
  const sx = (v) => ix + (v - f.x.min) / (f.x.max - f.x.min) * iw, sy = (v) => iy + ih - (v - f.y.min) / (f.y.max - f.y.min) * ih;
  PLOT = { sx, sy, px: (a, b) => [sx(a), sy(b)] };
  let g = "";
  for (let v = f.x.min; v <= f.x.max; v += f.x.step) g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${iy}" y2="${iy + ih}" stroke="var(--line)" stroke-width="1.4"/>`;
  for (let v = f.y.min; v <= f.y.max; v += f.y.step) g += `<line x1="${ix}" x2="${ix + iw}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1.4"/>`;
  g += `<line x1="${ix}" x2="${ix + iw + 6}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--ink)" stroke-width="2.2"/><line x1="${sx(0)}" x2="${sx(0)}" y1="${iy - 6}" y2="${iy + ih}" stroke="var(--ink)" stroke-width="2.2"/>`;
  for (const it of f.items) if (it.type === "function") {
    const fn = new Function("x", "return " + it.expr), pts = [];
    for (let i = 0; i <= 80; i++) { const xv = f.x.min + (f.x.max - f.x.min) * i / 80, yv = fn(xv); if (yv >= f.y.min && yv <= f.y.max) pts.push(`${sx(xv).toFixed(1)},${sy(yv).toFixed(1)}`); }
    g += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
  }
  for (const it of f.items) if (it.type === "point") g += `<circle cx="${sx(it.at[0])}" cy="${sy(it.at[1])}" r="9" fill="#fff"/><circle cx="${sx(it.at[0])}" cy="${sy(it.at[1])}" r="6.5" fill="var(--ink)"/>`;
  putP(`<svg width="${W}" height="${H}" viewBox="${x} ${y} ${W} ${H}" style="overflow:visible">${g}</svg>`, x, y, "z-index:1");
  for (let v = f.x.min; v <= f.x.max; v += f.x.step * (f.x.max - f.x.min > 12 ? 2 : 1)) putP(`${v}`, sx(v), sy(0) + 10, "transform:translateX(-50%);z-index:1").className = "tick";
  for (let v = f.y.min; v <= f.y.max; v += f.y.step * 2) if (v !== 0 || f.x.min !== 0) putP(`${v}`, ix - 12, sy(v) - 10, "transform:translateX(-100%);z-index:1").className = "tick";
  putP(f.x.label, ix + iw / 2, iy + ih + 40, "transform:translateX(-50%);z-index:1").className = "axl";
  putP(f.y.label, x + 8, iy + ih / 2, "transform:translate(-50%,-50%) rotate(-90deg) translateY(10px);transform-origin:50% 50%;z-index:1;left:" + (x + 22) + "px").className = "axl";
  const offs = { "(0, 19)": [-14, 10, "right"], "(2, 31)": [-16, -40, "right"] };
  for (const it of f.items) if (it.type === "point" && it.label) { const o = offs[it.label] || [12, -30, "left"];
    const lab = putP(it.label, sx(it.at[0]) + o[0], sy(it.at[1]) + o[1], `z-index:1;${o[2] === "right" ? "transform:translateX(-100%)" : ""}`); lab.className = "flabel"; }
  return { x, y, w: W, h: H };
}
function drawShape(f, x, y) {
  const s = 52, pts = f.items.flatMap((it) => it.points || (Array.isArray(it.from) ? [it.from, it.to] : []));
  const minX = Math.min(...pts.map((p) => p[0])), maxX = Math.max(...pts.map((p) => p[0])), maxY = Math.max(...pts.map((p) => p[1]));
  const ox = x + 50 - minX * s, oy = y + 40 + maxY * s;
  const P = (p) => [ox + p[0] * s, oy - p[1] * s];
  PLOT = { px: (a, b) => P([a, b]) };
  let g = "";
  for (const it of f.items) {
    if (it.type === "polygon") g += `<polygon points="${it.points.map((p) => P(p).join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linejoin="round"/>`;
    if (it.type === "segment") { const [a, b] = [P(it.from), P(it.to)]; g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>`; }
    if (it.type === "arc_angle") { const c = P(it.at), r = it.label.includes("x") ? 34 : 40, a0 = it.from * Math.PI / 180, a1 = it.to * Math.PI / 180;
      const p0 = [c[0] + r * Math.cos(a0), c[1] - r * Math.sin(a0)], p1 = [c[0] + r * Math.cos(a1), c[1] - r * Math.sin(a1)];
      const large = Math.abs(it.to - it.from) > 180 ? 1 : 0;
      g += `<path d="M${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 0 ${p1[0]} ${p1[1]}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
      const mid = (it.from + it.to) / 2 * Math.PI / 180, lr = r + 34;
      putP(md(it.label), c[0] + lr * Math.cos(mid), c[1] - lr * Math.sin(mid), "transform:translate(-50%,-50%);font-size:24px;z-index:1;white-space:nowrap"); }
  }
  for (const it of f.items) if (it.type === "label") { const c = P(it.at); putP(K(it.text), c[0], c[1], "transform:translate(-50%,-50%);font-size:26px;z-index:1"); }
  const W = (maxX - minX) * s + 100, H = maxY * s + 80;
  putP(`<svg width="${W}" height="${H}" viewBox="${x} ${y} ${W} ${H}" style="overflow:visible">${g}</svg>`, x, y, "z-index:1");
  return { x, y, w: W, h: H };
}
function drawTable(f, x, y) {
  const t = putP(`<table class="ptable"><tr>${f.headers.map((hh) => `<th>${md(hh)}</th>`).join("")}</tr>${f.rows.map((r, i) =>
    `<tr class="${r[0] === "Total" ? "total" : ""}">${r.map((c) => `<td>${md(c)}</td>`).join("")}</tr>`).join("")}</table>`, x, y + 6, "z-index:1");
  const tb = t.firstChild; tb.style.position = "static";
  const W = tb.offsetWidth, H = tb.offsetHeight;
  // cell centres, for ink on the table
  PLOT = { cell: (r, c) => { const cell = tb.rows[r].cells[c]; return [x + cell.offsetLeft + cell.offsetWidth / 2, y + 6 + cell.offsetTop + cell.offsetHeight / 2, cell.offsetWidth]; } };
  return { x, y, w: W, h: H + 6 };
}

// ============================================================== boot
async function boot() {
  await document.fonts.ready;
  const id = location.hash.slice(1);
  if (FRAMES[id]) {
    document.body.classList.add("single");
    FRAMES[id].draw();
    await document.fonts.ready;           // KaTeX's fonts load on first use: lay out again once they're in
    await new Promise((r) => setTimeout(r, 300));
    FRAMES[id].draw();
    document.title = "ready";
    return;
  }
  // the contact sheet: every frame at half size, with its caption
  const root = document.getElementById("root");
  root.className = "sheet-all";
  root.innerHTML = `<div><h1>SAT mode v2 · iPad mockups</h1><div class="intro">iPad Air 13", real size. The question is the page: the board fills the screen, the question is printed on it, the tutor writes in cobalt, the student in a thin pencil. Questions are real bank items. Layout rules: DESIGN-NOTES.md.</div></div>` +
    Object.entries(FRAMES).map(([k, f]) => { const port = k === "f13", w = port ? 1024 : 1366, h = port ? 1366 : 1024, s = port ? 0.6 : 0.75;
      return `<section class="fr"><h2>${f.title}</h2><p>${f.cap}</p><div class="box" style="width:${w * s}px;height:${h * s}px"><iframe src="#${k}" width="${w}" height="${h}" style="transform:scale(${s})" loading="lazy"></iframe></div></section>`; }).join("");
  root.querySelectorAll("iframe").forEach((f) => { const k = f.getAttribute("src"); f.src = location.pathname + k; });
}
boot();
</script>
