# The Agathon iPad app. Agathon.xcodeproj is generated from this file:
#   cd ios && xcodegen
# Sources are synced folders, so files added under Agathon/ or AgathonTests/ (in Xcode or on disk)
# are picked up without regenerating. Change targets, settings or Info.plist keys here, not in
# Xcode's editor, or the next `xcodegen` run drops them.
name: Agathon
options:
  bundleIdPrefix: app.agathon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set to the Apple Developer team ID once there is one (Xcode > Settings > Accounts).
    # Simulator builds need none.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Agathon:
    type: application
    platform: iOS
    sources:
      - path: Agathon
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.agathon.Agathon
        PRODUCT_NAME: Agathon
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Agathon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # localhost only, for a Debug run pointed at `npm run dev` (AGATHON_API_URL in the scheme).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Ask's hold-to-talk mic and Lecture mode.
        NSMicrophoneUsageDescription: Agathon listens while you hold the mic to ask a question out loud, and during Lecture mode.
        # Lecture mode's on-device transcription (the browser speech engine runs on Apple's).
        NSSpeechRecognitionUsageDescription: Agathon turns what the teacher says into notes on your board during Lecture mode.
        # The picture button's "Take Photo" (a file input accepting images offers the camera).
        NSCameraUsageDescription: Take a photo of a worksheet or a drawing to put it on your board.
        # "Save Video" / "Save Image" from the share sheet after saving a replay or a picture.
        NSPhotoLibraryAddUsageDescription: Agathon saves your board replays and pictures to your photo library.
    scheme:
      testTargets:
        - AgathonTests
      gatherCoverageData: false
      environmentVariables:
        # Tick in Product > Scheme > Edit Scheme > Run > Arguments to call a local `npm run dev`.
        - variable: AGATHON_API_URL
          value: http://localhost:3000
          isEnabled: false
  AgathonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgathonTests
        type: syncedFolder
    dependencies:
      - target: Agathon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.agathon.AgathonTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Agathon.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Agathon
        BUNDLE_LOADER: $(TEST_HOST)
